name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Install ipsw
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install blacktop/tap/ipsw --formula

      - name: Get OTA URLs
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          echo "=== iOS 18 OTA URLs for iPhone11,2 ==="
          ipsw download ota --platform ios --device iPhone11,2 --urls -y 2>&1 | head -30
          echo "=== Latest ==="
          ipsw download ota --platform ios --device iPhone11,2 --latest --urls -y 2>&1 | head -30
