name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Find and extract dylib
        run: |
          echo "=== Searching everywhere ==="
          find / -name "libswiftObservation.dylib" 2>/dev/null || true
          echo "=== SDK path ==="
          xcrun --sdk iphoneos --show-sdk-path
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== Swift lib path ==="
          ls $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/ | grep Observation || true
          cp $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/libswiftObservation.dylib ./libswiftObservation.dylib
          file ./libswiftObservation.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswiftObservation
          path: libswiftObservation.dylib
