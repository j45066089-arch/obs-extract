name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Install ipsw
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install blacktop/tap/ipsw --formula

      - name: Extract from remote OTA
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          echo "=== OTA list ==="
          ipsw download ota --platform ios --device iPhone11,2 --version 18.0 --list 2>&1 | head -20
          echo "=== download help ==="
          ipsw download ota --help 2>&1 | grep -i "confirm\|yes\|non-interactive\|skip" || true
