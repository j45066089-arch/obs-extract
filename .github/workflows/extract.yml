name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Install ipsw
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install blacktop/tap/ipsw --formula

      - name: Extract from remote OTA
        run: |
          ipsw download ota --platform ios --device iPhone11,2 --version 18.0 --dyld --dyld-arch arm64e
          DSC=$(find . -name "dyld_shared_cache_arm64e" | head -1)
          echo "Found cache: $DSC"
          mkdir -p ./out
          ipsw dyld extract "$DSC" libswiftObservation.dylib -o ./out/
          find ./out -name "*.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswiftObservation
          path: out/**/*.dylib
