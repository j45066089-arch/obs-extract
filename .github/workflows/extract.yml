name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Install ipsw
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install blacktop/tap/ipsw --formula

      - name: Extract from remote OTA
        run: |
          ipsw download ota --platform ios --device iPhone11,2 --version 18.0 --dyld --dyld-arch arm64e
          find . -name "dyld_shared_cache*" | head -5
          ipsw dyld extract $(find . -name "dyld_shared_cache_arm64e" | head -1) libswiftObservation -o ./out/
          file ./out/usr/lib/swift/libswiftObservation.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswiftObservation
          path: out/usr/lib/swift/libswiftObservation.dylib
