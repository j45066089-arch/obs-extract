name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Install ipsw
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install blacktop/tap/ipsw --formula

      - name: Extract from remote OTA
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          ipsw download ota --platform ios --device iPhone11,2 --version 18.0 --dyld --dyld-arch arm64e -y
          echo "=== Downloaded files ==="
          find . -type f | head -30
          echo "=== All dyld caches ==="
          find . -name "*dyld*" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswiftObservation
          path: "**/*.dylib"
