name: Extract libswiftObservation
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Extract dylib
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Searching in Toolchain ==="
          find /Applications/Xcode_26.6.app/Contents/Developer/Toolchains -name "libswiftObservation*" 2>/dev/null
          echo "=== Searching in Platforms ==="
          find /Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform -name "libswiftObservation*" 2>/dev/null
          echo "=== Searching in Library ==="
          find /Library -name "libswiftObservation*" 2>/dev/null
          echo "=== done ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswiftObservation
          path: libswiftObservation.dylib
